# ============ DragonEggRun - 드래곤알 들고 도망가기 ============

# 시작 시 알 지급 방식: random(준비시간 후 랜덤 1명) / map(맵에 알 생성, 먼저 줍기)
mode: random

# 시작(/드래곤알 시작) 후 알이 등장하기까지의 준비(흩어지는) 시간 (초)
prep-seconds: 60

# 알 등장 후 게임 진행 시간 (초). 0이 되면 그때 알을 든 사람이 승리
game-seconds: 300

# mode=map 일 때 알이 생성될 위치 (/드래곤알 위치설정 으로 자동 저장)
map-egg:
  world: ""
  x: 0
  y: 0
  z: 0

steal:
  freeze-seconds: 10     # 뺏긴 사람이 얼어붙는 시간
  grace-seconds: 2       # 알 획득 직후 다시 뺏기지 않는 보호 시간 (핑퐁 방지)

display:
  scale: 0.5             # 머리 위 알 크기
  y-offset: 0.7          # 눈높이 기준 추가 높이

# 술래(알 소지자) 투명/노출
stealth:
  reveal-radius: 5.0     # 이 거리 안의 상대에게만 술래가 보임 (그 외엔 투명)
  camp-seconds: 3        # 이 시간 이상 제자리에 있으면 투명 해제 + 발광

# 알을 든 사람이 남기는 발자국
footprint:
  enabled: true
  night-only: false      # false=낮/밤 항상 표시 / true=밤(아래 night 구간)에만
  step-distance: 0.6     # 이만큼 움직일 때마다 발자국 1개
  lifetime-ticks: 120    # 발자국 잔류 시간 (20틱=1초, 120=6초)
  size: 0.9
  view-distance: 48
  # 참가자별 발자국 색 (참가 순서대로 배정 → 누가 들고 있는지 색으로 구분)
  colors:
    - "#E74C3C"  # 빨강
    - "#3498DB"  # 파랑
    - "#2ECC71"  # 초록
    - "#F1C40F"  # 노랑
    - "#9B59B6"  # 보라
    - "#E67E22"  # 주황
    - "#1ABC9C"  # 청록
    - "#FF6FB5"  # 분홍
    - "#FFFFFF"  # 흰색
    - "#34495E"  # 남색

# night-only=true 일 때 발자국이 생성되는 밤 시간대 (0~24000틱, 13000~23000 = 밤)
night:
  start: 13000
  end: 23000

